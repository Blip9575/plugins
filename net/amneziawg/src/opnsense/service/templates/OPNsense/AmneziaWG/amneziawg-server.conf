{% if helpers.exists('OPNsense.amneziawg.general.enabled') and OPNsense.amneziawg.general.enabled == '1' %}
{% if helpers.exists('OPNsense.amneziawg.server.servers.server') %}
{%   for server_list in helpers.toList('OPNsense.amneziawg.server.servers.server') %}
{%     if TARGET_FILTERS['OPNsense.amneziawg.server.servers.server.' ~ loop.index0] or TARGET_FILTERS['OPNsense.amneziawg.server.servers.server'] %}
{%       if server_list.enabled == '1' %}
####################################################
# Interface settings, not used by `awg`            #
# Only used for reference and detection of changes #
# in the configuration                             #
####################################################
# Address =  {{server_list.tunneladdress|default('')}}
# DNS = {{ server_list.dns|default('')}}
# MTU = {{ server_list.mtu|default('') }}
# disableroutes = {{server_list.disableroutes}}
# gateway = {{server_list.gateway}}
# debug = {{ server_list.debug }}

[Interface]
PrivateKey = {{ server_list.privkey }}
{%         if server_list.port|default('') != '' %}
ListenPort = {{ server_list.port }}
{%         endif %}
{#       AmneziaWG 2.0 #}
{%         for awg_key, awg_name in [('jc', 'Jc'), ('jmin', 'Jmin'), ('jmax', 'Jmax'), ('s1', 'S1'), ('s2', 'S2'), ('s3', 'S3'), ('s4', 'S4'), ('h1', 'H1'), ('h2', 'H2'), ('h3', 'H3'), ('h4', 'H4'), ('i1', 'I1'), ('i2', 'I2'), ('i3', 'I3'), ('i4', 'I4'), ('i5', 'I5')] %}
{%           if server_list[awg_key]|default('') != '' %}
{{ awg_name }} = {{ server_list[awg_key] }}
{%           endif %}
{%         endfor %}
{#       AmneziaWG 3.x #}
{%         for awg_key, awg_name in [('headerprotectionkey', 'HeaderProtectionKey'), ('contentpaddingaddition', 'ContentPaddingAddition'), ('rekeyaftertime', 'RekeyAfterTime'), ('rekeytimeout', 'RekeyTimeout'), ('rejectaftertime', 'RejectAfterTime'), ('keepalivetimeout', 'KeepaliveTimeout'), ('maxhandshakeattempts', 'MaxHandshakeAttempts')] %}
{%           if server_list[awg_key]|default('') != '' %}
{{ awg_name }} = {{ server_list[awg_key] }}
{%           endif %}
{%         endfor %}
{%         if server_list.randomtrailers|default('0') == '1' %}
RandomTrailers = on
{%         endif %}
{%         if server_list.disablecookies|default('0') == '1' %}
DisableCookies = on
{%         endif %}
{%         if server_list.peers|default('') != '' %}
{%           for peerlist in server_list.peers.split(",") %}
{%             set peerlist2_data = helpers.getUUID(peerlist) %}
{%             if peerlist2_data != {} and peerlist2_data.enabled == '1' %}

[Peer]
# friendly_name = {{ peerlist2_data.name }}
PublicKey = {{ peerlist2_data.pubkey }}
{%               if peerlist2_data.psk|default('') != '' %}
PresharedKey = {{ peerlist2_data.psk }}
{%               endif %}
{%               if peerlist2_data.serveraddress|default('') != '' %}
Endpoint = {{ peerlist2_data.serveraddress }}{% if peerlist2_data.serverport|default('') != '' %}:{{ peerlist2_data.serverport }}{% else %}:51820{% endif %}
{%               endif %}

AllowedIPs = {{ peerlist2_data.tunneladdress }}
{%               if peerlist2_data.keepalive|default('') != '' %}
PersistentKeepalive = {{ peerlist2_data.keepalive }}
{%               endif %}
{%             endif %}
{%           endfor %}
{%         endif %}
{%       endif %}
{%     endif %}
{%   endfor %}
{% endif %}
{% endif %}
