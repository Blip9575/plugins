[start]
command:/usr/local/opnsense/scripts/amneziawg/awg-service-control.php
parameters: start %s
type:script
message: start amneziawg instance %s

[stop]
command:/usr/local/opnsense/scripts/amneziawg/awg-service-control.php
parameters: stop %s
type:script
message: stop amneziawg instance %s
allowed_groups:wheel,wwwonly

[restart]
command:/usr/local/opnsense/scripts/amneziawg/awg-service-control.php
parameters: restart %s
type:script
message: restart amneziawg instance %s
description:Restart AmneziaWG

[configure]
command:/usr/local/opnsense/scripts/amneziawg/awg-service-control.php
parameters: -a configure %s
type:script
message: configure amneziawg instances (%s)

[renew]
command:/usr/local/opnsense/scripts/amneziawg/reresolve-dns.py
parameters:
type:script
message:Renew DNS for AmneziaWG
description:Renew DNS for AmneziaWG on stale connections

[gen_keypair]
command:/usr/local/opnsense/scripts/amneziawg/gen_keypair.py
parameters:
type:script_output
message:Generating AmneziaWG keypair

[gen_psk]
command:/usr/local/bin/awg genpsk
parameters:
type:script_output
message:Generating AmneziaWG keypair


[show]
command:/usr/local/opnsense/scripts/amneziawg/awg_show.py
parameters:
type:script_output
message:show AmneziaWG statistics [dump]

[showconf]
command:/usr/local/bin/awg show all
parameters:
type:script_output
message:Show AmneziaWG config

[showhandshake]
command:/usr/local/bin/awg show all latest-handshakes
parameters:
type:script_output
message:Show AmneziaWG handshakes
